name: "Ezviz Camera Proxy"
version: "1.8.5"
slug: ezviz-camera-proxy
description: "Proxy per telecamere Ezviz (incluso HP2) che non supportano RTSP. Utilizza l'API Ezviz Cloud e Open Platform per istantanee, eventi, video streaming HLS nativo e download automatico clip MP4."
url: "https://github.com/francescodoffizi/ha-ezviz-stream"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:doorbell-video
panel_title: Ezviz Camera
homeassistant_api: true
hassio_api: true
services:
  - "mqtt:want"
ports:
  8099/tcp: 8099
map:
  - type: share
    read_only: false
options:
  ezviz_username: ""
  ezviz_password: ""
  ezviz_region: "apiieu.ezvizlife.com"
  ezviz_open_domain: "https://ieuopen.ezvizlife.com"
  ezviz_app_key: ""
  ezviz_app_secret: ""
  ezviz_access_token: ""
  ezviz_encryption_key: ""
  camera_serial: ""
  camera_password: ""
  snapshot_interval: 60
  enable_mqtt_events: true
  save_event_clips: true
  video_retention_days: 7
  max_stored_events: 100
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  ezviz_username: str
  ezviz_password: password
  ezviz_region: "str?"
  ezviz_open_domain: "str?"
  ezviz_app_key: "str?"
  ezviz_app_secret: "password?"
  ezviz_access_token: "password?"
  ezviz_encryption_key: "str?"
  camera_serial: str
  camera_password: password
  snapshot_interval: int(0,86400)
  enable_mqtt_events: bool
  save_event_clips: "bool?"
  video_retention_days: "int(0,365)?"
  max_stored_events: "int(10,500)?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_user: "str?"
  mqtt_password: "password?"
init: false

